name: TRIAGE Repository Artifact Index

on:
  push:
    branches:
      - 'triage/renegade-self-analysis-*'
    paths-ignore:
      - 'triage/repo_index/ARTIFACT_INDEX.yaml'
      - 'triage/repo_index/FILE_INDEX.tsv'

permissions:
  contents: write

jobs:
  repo-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate complete tracked-artifact index
        run: python scripts/repo_artifact_index.py --write

      - name: Verify deterministic index
        run: python scripts/repo_artifact_index.py --check

      - name: Commit refreshed offline index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add triage/repo_index/ARTIFACT_INDEX.yaml triage/repo_index/FILE_INDEX.tsv
          if git diff --cached --quiet; then
            echo 'Index already current'
          else
            git commit -m 'triage: refresh offline artifact index [skip ci]'
            git push
          fi
