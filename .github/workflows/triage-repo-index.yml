name: TRIAGE Repository Artifact Index

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/repo_artifact_index.py'
      - 'triage/repo_index/README.md'
      - '.github/workflows/triage-repo-index.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate complete tracked-artifact index
        run: python scripts/repo_artifact_index.py --write

      - name: Verify deterministic index
        run: python scripts/repo_artifact_index.py --check

      - name: Upload generated repository index
        uses: actions/upload-artifact@v4
        with:
          name: repo-artifact-index-${{ github.sha }}
          path: |
            triage/repo_index/ARTIFACT_INDEX.yaml
            triage/repo_index/FILE_INDEX.tsv
          retention-days: 14
