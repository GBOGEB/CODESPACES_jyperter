name: Controlled property table

on:
  pull_request:
    paths:
      - 'src/property_table_backend.py'
      - 'src/helium_flow.py'
      - 'tests/test_controlled_property_table.py'
      - '.github/workflows/controlled-property-table.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-property-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas
      - run: python -m pytest tests/test_controlled_property_table.py -q
